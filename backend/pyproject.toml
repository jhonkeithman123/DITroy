[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ditroy-ai"
version = "0.1.0"
description = "Modular personal AI cognitive backend with persistent memory, fact extraction, and local LLM orchestration"
readme = "README.md"
requires-python = ">=3.9, <3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "httpx>=0.27.2",
    "supabase>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.3",
]
supabase = [
    "supabase>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ditroy*"]
